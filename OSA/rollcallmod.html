<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="rollcallmod.png">
  <title>出缺勤資料整合系統</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  
  <script type="text/javascript" src="https://gc.kis.v2.scr.kaspersky-labs.com/FD126C42-EBFA-4E12-B309-BB3FDD723AC1/main.js?attr=kiCm95m287yJ9Lta1W76C0G9oKD3Gu8uc_TBgwtWUGNEymcoHRoV79xFYO5GCC_Skm71dtKmCl472j7ssbtrOHwn4etUR7g4LSGNVBIaiyycJuM3pORmZvpAIcxB1tBp3IdCtzSSYqRSN-JR-5cr-uTF8Hv343N1lIRCm6Fr_Thf8yWIb5B6SjbAODZOG9bXKfD1PWNlA7HigKN67U0sOvqf93FUfo6-SwescaavuhOybhKCji5A1U50-7iGOQ8GKkzzDEHVZndqLTP2yG9oMauvC_FZbPFU0yOUSyYIJjCvBCuvlajaTQNKiwt_t21PkQeX-_TiCzxb_11kfYAYxw" charset="UTF-8"></script><style>
    /* 讓大表格寬敞展開，同時保留原本 CSS 的色調與圓角 */
    nav.navbar {
      max-width: 96% !important;
    }
    .wide-container {
      max-width: 96%;
      margin: 0 auto;
    }
    #uploadCard {
      max-width: 750px;
      margin: 0 auto 15px auto;
    }

    /* 拖曳上傳區 */
    .upload-drop-zone {
      border: 2px dashed #ced4da;
      border-radius: 10px;
      padding: 40px 20px;
      text-align: center;
      background-color: #ffffff;
      cursor: pointer;
      transition: all 0.2s ease-in-out;
    }
    .upload-drop-zone:hover,
    .upload-drop-zone.drag-over {
      border-color: #0d6efd;
      background-color: #f1f7ff;
    }

    /* 第一層：年級分頁標籤列樣式 */
    .grade-tabs-bar {
      background-color: #e9ecef;
      padding: 10px 15px 0 15px;
      border-bottom: 1px solid #dee2e6;
    }
    .grade-tabs-bar .nav-tabs {
      border-bottom: none;
      gap: 6px;
    }
    .grade-tabs-bar .nav-link {
      color: #495057;
      font-weight: 600;
      border-top-left-radius: 8px;
      border-top-right-radius: 8px;
      padding: 8px 18px;
      font-size: 0.98rem;
      background-color: #dee2e6;
      border: 1px solid #ced4da;
      border-bottom: none;
      transition: all 0.15s ease;
    }
    .grade-tabs-bar .nav-link:hover {
      background-color: #d3d9df;
    }
    .grade-tabs-bar .nav-link.active {
      background-color: #f8f9fa;
      color: #0d6efd;
      font-weight: 700;
      border-color: #dee2e6 #dee2e6 #f8f9fa;
      margin-bottom: -1px;
    }

    /* 第二層：七天分頁標籤列樣式 */
    .day-tabs-bar {
      background-color: #f8f9fa;
      padding: 10px 15px 0 15px;
      border-bottom: 1px solid #dee2e6;
    }
    .day-tabs-bar .nav-tabs {
      border-bottom: none;
      gap: 4px;
    }
    .day-tabs-bar .nav-link {
      color: #495057;
      font-weight: 500;
      border-top-left-radius: 8px;
      border-top-right-radius: 8px;
      padding: 7px 13px;
      font-size: 0.9rem;
      background-color: #e9ecef;
      border: 1px solid #dee2e6;
      border-bottom: none;
    }
    .day-tabs-bar .nav-link:hover {
      background-color: #f1f3f5;
    }
    .day-tabs-bar .nav-link.active {
      background-color: #ffffff;
      color: #0d6efd;
      font-weight: 700;
      border-color: #dee2e6 #dee2e6 #ffffff;
      margin-bottom: -1px;
    }

    /* 大表格與凍結頂端列設定 */
    .table-scroll-wrapper {
      max-height: 64vh;
      overflow-y: auto;
      overflow-x: auto;
      position: relative;
    }
    #dataTable {
      border-collapse: separate;
      border-spacing: 0;
    }
    #dataTable th,
    #dataTable td {
      vertical-align: middle;
      text-align: center;
      white-space: nowrap;
      padding: 6px 5px;
      border-right: 1px solid #dee2e6;
      border-bottom: 1px solid #dee2e6;
    }
    /* 凍結第 1 列：整欄清除按鈕列 */
    #dataTable thead tr.col-action-row th {
      position: sticky;
      top: 0;
      z-index: 20;
      background-color: #ffffff;
      padding: 6px 4px;
      height: 38px;
      border-top: 1px solid #dee2e6;
      border-bottom: 1px solid #dee2e6;
    }
    /* 凍結第 2 列：正式欄位標題列（緊接在第 1 列下方） */
    #dataTable thead tr.header-title-row th {
      position: sticky;
      top: 38px;
      z-index: 19;
      background-color: #f1f3f5;
      font-size: 0.9rem;
      border-bottom: 2px solid #ced4da;
      box-shadow: 0 2px 3px rgba(0, 0, 0, 0.05);
    }

    /* 新增列中的 5碼班級座號輸入框樣式 */
    .new-input-5 {
      width: 78px !important;
      margin: 0 auto;
      padding: 2px 4px !important;
      text-align: center;
      font-size: 0.88rem;
      letter-spacing: 0.5px;
    }
    .date-group {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }
    .date-input-y {
      width: 46px !important;
      padding: 2px 3px !important;
      text-align: center;
      font-size: 0.88rem;
    }
    .date-input-md {
      width: 36px !important;
      padding: 2px 3px !important;
      text-align: center;
      font-size: 0.88rem;
    }

    /* 必填欄位為空或格式不符時的紅色底色提醒 */
    .input-empty-error {
      background-color: #f8d7da !important;
      border-color: #dc3545 !important;
    }

    /* 每一節課文字輸入框 */
    .period-input {
      width: 36px !important;
      height: 32px !important;
      margin: 0 auto;
      padding: 2px !important;
      text-align: center;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 6px;
    }
    .period-input.is-absent {
      background-color: #fff5f5;
      border-color: #dc3545;
      color: #dc3545;
    }

    /* 新增一列按鈕區 */
    .add-row-bar {
      padding: 12px;
      background-color: #f8f9fa;
      border-top: 1px solid #dee2e6;
      text-align: center;
      border-bottom-left-radius: 10px;
      border-bottom-right-radius: 10px;
    }
  </style>
</head>
<body>

  <!-- 右上角浮動通知框 -->
  <div id="msgAlert" class="alert alert-success shadow" role="alert"></div>

  <!-- 頂部導覽列 -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold text-primary" href="#">
        <i class="bi bi-file-earmark-text me-1"></i> 出缺勤資料整合系統
      </a>
    </div>
  </nav>

  <!-- 主內容寬版容器 -->
  <div class="wide-container">

    <!-- 區塊 1：檔案上傳卡片 (主檔 A) -->
    <div class="card" id="uploadCard">
      <div class="card-header bg-white fw-bold">
        <i class="bi bi-cloud-arrow-up me-1"></i> 匯入主檔 TXT
      </div>
      <div class="card-body">
        <div class="upload-drop-zone" id="dropZone">
          <i class="bi bi-file-text display-4 text-secondary"></i>
          <h6 class="mt-3 mb-2">將主檔 TXT 拖曳到此處</h6>
          <button type="button" class="btn btn-primary btn-sm px-3" id="selectFileBtn">
            <i class="bi bi-folder2-open me-1"></i> 選擇檔案
          </button>
          <input type="file" id="fileInput" accept=".txt,text/plain" class="d-none">
        </div>
      </div>
    </div>

    <!-- 區塊 2：大表格資料編輯卡片 -->
    <div class="card d-none" id="editorCard">
      <div class="card-header bg-white d-flex flex-wrap justify-content-between align-items-center gap-2 py-3">
        <!-- 左側：標題 + 檔名徽章 + 筆數統計 -->
        <div class="d-flex align-items-center flex-wrap gap-2">
          <span class="fw-bold fs-6">
            <i class="bi bi-table me-1"></i> 出缺勤明細表
          </span>
          <span class="badge bg-secondary" id="fileNameBadge">未命名.txt</span>
          <span class="text-muted small ms-1">
            目前共 <strong id="rowCount" class="text-dark">0</strong> 筆資料
            （該年級本日 <strong id="tabRowCount" class="text-primary">0</strong> 筆）
          </span>
        </div>

        <!-- 右側：重新上傳 + 匯入整合 TXT (B) + 下載新版 TXT -->
        <div class="d-flex align-items-center flex-wrap gap-2">
          <button type="button" class="btn btn-outline-danger btn-sm" id="resetBtn">
            <i class="bi bi-arrow-counterclockwise me-1"></i> 重新上傳
          </button>
          
          <button type="button" class="btn btn-primary btn-sm px-3" id="mergeFileBtn" title="匯入第二個 TXT 進行資料覆蓋與補登">
            <i class="bi bi-file-earmark-plus me-1"></i> 匯入整合 TXT
          </button>
          <input type="file" id="mergeFileInput" accept=".txt,text/plain" class="d-none">

          <button type="button" class="btn btn-success btn-sm px-3" id="downloadBtn">
            <i class="bi bi-download me-1"></i> 下載新版 TXT
          </button>
        </div>
      </div>

      <!-- 第一層：年級分頁標籤區 -->
      <div class="grade-tabs-bar">
        <ul class="nav nav-tabs" id="gradeTabs" role="tablist">
          <!-- 由 app.js 動態產生年級標籤（如：一年級、二年級、三年級） -->
        </ul>
      </div>

      <!-- 第二層：一周七天分頁標籤區 -->
      <div class="day-tabs-bar">
        <ul class="nav nav-tabs" id="dayTabs" role="tablist">
          <!-- 由 app.js 動態產生該年級對應的 7 個「日期 + 星期幾」分頁標籤 -->
        </ul>
      </div>

      <div class="card-body p-0">
        <div class="table-scroll-wrapper">
          <table class="table table-hover mb-0" id="dataTable">
            <thead id="tableHead">
              <!-- 第 1 列：13 個節次上方的「整欄清除」按鈕列 (凍結於最頂端，僅清除選定年級+選定日期) -->
              <tr class="col-action-row">
                <th colspan="3"></th>
                <th><button type="button" class="btn btn-outline-secondary btn-sm py-0 px-2 clear-col-btn" data-pindex="0" title="將本年級本日「午休」整欄設為0"><i class="bi bi-eraser"></i></button></th>
                <th><button type="button" class="btn btn-outline-secondary btn-sm py-0 px-2 clear-col-btn" data-pindex="1" title="將本年級本日「早休」整欄設為0"><i class="bi bi-eraser"></i></button></th>
                <th><button type="button" class="btn btn-outline-secondary btn-sm py-0 px-2 clear-col-btn" data-pindex="2" title="將本年級本日「第1節」整欄設為0"><i class="bi bi-eraser"></i></button></th>
                <th><button type="button" class="btn btn-outline-secondary btn-sm py-0 px-2 clear-col-btn" data-pindex="3" title="將本年級本日「第2節」整欄設為0"><i class="bi bi-eraser"></i></button></th>
                <th><button type="button" class="btn btn-outline-secondary btn-sm py-0 px-2 clear-col-btn" data-pindex="4" title="將本年級本日「第3節」整欄設為0"><i class="bi bi-eraser"></i></button></th>
                <th><button type="button" class="btn btn-outline-secondary btn-sm py-0 px-2 clear-col-btn" data-pindex="5" title="將本年級本日「第4節」整欄設為0"><i class="bi bi-eraser"></i></button></th>
                <th><button type="button" class="btn btn-outline-secondary btn-sm py-0 px-2 clear-col-btn" data-pindex="6" title="將本年級本日「第5節」整欄設為0"><i class="bi bi-eraser"></i></button></th>
                <th><button type="button" class="btn btn-outline-secondary btn-sm py-0 px-2 clear-col-btn" data-pindex="7" title="將本年級本日「第6節」整欄設為0"><i class="bi bi-eraser"></i></button></th>
                <th><button type="button" class="btn btn-outline-secondary btn-sm py-0 px-2 clear-col-btn" data-pindex="8" title="將本年級本日「第7節」整欄設為0"><i class="bi bi-eraser"></i></button></th>
                <th><button type="button" class="btn btn-outline-secondary btn-sm py-0 px-2 clear-col-btn" data-pindex="9" title="將本年級本日「第8節」整欄設為0"><i class="bi bi-eraser"></i></button></th>
                <th><button type="button" class="btn btn-outline-secondary btn-sm py-0 px-2 clear-col-btn" data-pindex="10" title="將本年級本日「第9節」整欄設為0"><i class="bi bi-eraser"></i></button></th>
                <th><button type="button" class="btn btn-outline-secondary btn-sm py-0 px-2 clear-col-btn" data-pindex="11" title="將本年級本日「第10節」整欄設為0"><i class="bi bi-eraser"></i></button></th>
                <th><button type="button" class="btn btn-outline-secondary btn-sm py-0 px-2 clear-col-btn" data-pindex="12" title="將本年級本日「第11節」整欄設為0"><i class="bi bi-eraser"></i></button></th>
                <th></th>
              </tr>
              <!-- 第 2 列：正式欄位標題 (緊接凍結於第 1 列下方) -->
              <tr class="header-title-row">
                <th style="width: 45px;">#</th>
                <th>班級座號</th>
                <th>日期</th>
                <th>午休</th>
                <th>早休</th>
                <th>第1節</th>
                <th>第2節</th>
                <th>第3節</th>
                <th>第4節</th>
                <th>第5節</th>
                <th>第6節</th>
                <th>第7節</th>
                <th>第8節</th>
                <th>第9節</th>
                <th>第10節</th>
                <th>第11節</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <!-- 由 app.js 動態產生目前選定年級 + 日期的資料列 -->
            </tbody>
          </table>
        </div>

        <!-- 表格底部的 "+" 新增列按鈕（自動帶入目前年級與日期） -->
        <div class="add-row-bar">
          <button type="button" class="btn btn-outline-primary btn-sm px-4" id="addRowBtn">
            <i class="bi bi-plus-lg me-1"></i> 在本年級本日新增一筆資料
          </button>
        </div>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
