<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>出缺勤資料過濾系統</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  
  <style>
    /* 讓大表格寬敞展開，同時保留你原本 CSS 的色調與圓角 */
    nav.navbar {
      max-width: 96% !important;
    }
    .wide-container {
      max-width: 96%;
      margin: 0 auto;
    }
    #uploadCard {
      max-width: 750px;
      margin: 0 auto 15px auto;
    }

    /* 拖曳上傳區 */
    .upload-drop-zone {
      border: 2px dashed #ced4da;
      border-radius: 10px;
      padding: 40px 20px;
      text-align: center;
      background-color: #ffffff;
      cursor: pointer;
      transition: all 0.2s ease-in-out;
    }
    .upload-drop-zone:hover,
    .upload-drop-zone.drag-over {
      border-color: #0d6efd;
      background-color: #f1f7ff;
    }

    /* 大表格樣式 */
    #dataTable th,
    #dataTable td {
      vertical-align: middle;
      text-align: center;
      white-space: nowrap;
      padding: 6px 5px;
    }
    #dataTable thead th {
      background-color: #f1f3f5;
      font-size: 0.9rem;
    }
    /* 最上方整欄清除快捷列樣式 */
    #dataTable thead tr.col-action-row th {
      background-color: #ffffff;
      padding: 6px 4px;
      border-bottom: 1px solid #dee2e6;
    }

    /* 新增列中的 5碼班級座號輸入框樣式 */
    .new-input-5 {
      width: 72px !important;
      margin: 0 auto;
      padding: 2px 4px !important;
      text-align: center;
      font-size: 0.9rem;
      letter-spacing: 0.5px;
    }
    .date-group {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }
    .date-input-y {
      width: 46px !important;
      padding: 2px 3px !important;
      text-align: center;
      font-size: 0.88rem;
    }
    .date-input-md {
      width: 36px !important;
      padding: 2px 3px !important;
      text-align: center;
      font-size: 0.88rem;
    }

    /* 必填欄位為空或格式不符時的紅色底色提醒 */
    .input-empty-error {
      background-color: #f8d7da !important;
      border-color: #dc3545 !important;
    }

    /* 每一節課文字輸入框 */
    .period-input {
      width: 36px !important;
      height: 32px !important;
      margin: 0 auto;
      padding: 2px !important;
      text-align: center;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 6px;
    }
    .period-input.is-absent {
      background-color: #fff5f5;
      border-color: #dc3545;
      color: #dc3545;
    }

    /* 新增一列按鈕區 */
    .add-row-bar {
      padding: 12px;
      background-color: #f8f9fa;
      border-top: 1px solid #dee2e6;
      text-align: center;
      border-bottom-left-radius: 10px;
      border-bottom-right-radius: 10px;
    }
  </style>
</head>
<body>

  <!-- 右上角浮動通知框 -->
  <div id="msgAlert" class="alert alert-success shadow" role="alert"></div>

  <!-- 頂部導覽列 -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold text-primary" href="#">
        <i class="bi bi-file-earmark-text me-1"></i> 出缺勤資料過濾系統
      </a>
    </div>
  </nav>

  <!-- 主內容寬版容器 -->
  <div class="wide-container">

    <!-- 區塊 1：檔案上傳卡片 -->
    <div class="card" id="uploadCard">
      <div class="card-header bg-white fw-bold">
        <i class="bi bi-cloud-arrow-up me-1"></i> 匯入 TXT 檔案
      </div>
      <div class="card-body">
        <div class="upload-drop-zone" id="dropZone">
          <i class="bi bi-file-text display-4 text-secondary"></i>
          <h6 class="mt-3 mb-2">將 TXT 檔案拖曳到此處</h6>
          <button type="button" class="btn btn-primary btn-sm px-3" id="selectFileBtn">
            <i class="bi bi-folder2-open me-1"></i> 選擇檔案
          </button>
          <input type="file" id="fileInput" accept=".txt,text/plain" class="d-none">
        </div>
      </div>
    </div>

    <!-- 區塊 2：大表格資料編輯卡片 -->
    <div class="card d-none" id="editorCard">
      <div class="card-header bg-white d-flex flex-wrap justify-content-between align-items-center gap-2 py-3">
        <!-- 左側：標題 + 檔名徽章 + 目前共 N 筆資料 -->
        <div class="d-flex align-items-center flex-wrap gap-2">
          <span class="fw-bold fs-6">
            <i class="bi bi-table me-1"></i> 出缺勤明細表
          </span>
          <span class="badge bg-secondary" id="fileNameBadge">未命名.txt</span>
          <span class="text-muted small ms-1">目前共 <strong id="rowCount" class="text-dark">0</strong> 筆資料</span>
        </div>

        <!-- 右側：重新上傳 + 下載新版 TXT -->
        <div class="d-flex align-items-center gap-2">
          <button type="button" class="btn btn-outline-danger btn-sm" id="resetBtn">
            <i class="bi bi-arrow-counterclockwise me-1"></i> 重新上傳
          </button>
          <button type="button" class="btn btn-success btn-sm px-3" id="downloadBtn">
            <i class="bi bi-download me-1"></i> 下載新版 TXT
          </button>
        </div>
      </div>

      <div class="card-body p-0">
        <div class="table-responsive" style="max-height: 72vh;">
          <table class="table table-bordered table-hover mb-0" id="dataTable">
            <thead id="tableHead">
              <!-- 第 1 列：12 個節次上方的「整欄清除」按鈕列 (前3欄合併：#、班級座號、日期) -->
              <tr class="col-action-row">
                <th colspan="3"></th>
                <th><button type="button" class="btn btn-outline-secondary btn-sm py-0 px-2 clear-col-btn" data-pindex="0" title="整欄午休設為0"><i class="bi bi-eraser"></i></button></th>
                <th><button type="button" class="btn btn-outline-secondary btn-sm py-0 px-2 clear-col-btn" data-pindex="1" title="整欄早自習設為0"><i class="bi bi-eraser"></i></button></th>
                <th><button type="button" class="btn btn-outline-secondary btn-sm py-0 px-2 clear-col-btn" data-pindex="2" title="整欄第1節設為0"><i class="bi bi-eraser"></i></button></th>
                <th><button type="button" class="btn btn-outline-secondary btn-sm py-0 px-2 clear-col-btn" data-pindex="3" title="整欄第2節設為0"><i class="bi bi-eraser"></i></button></th>
                <th><button type="button" class="btn btn-outline-secondary btn-sm py-0 px-2 clear-col-btn" data-pindex="4" title="整欄第3節設為0"><i class="bi bi-eraser"></i></button></th>
                <th><button type="button" class="btn btn-outline-secondary btn-sm py-0 px-2 clear-col-btn" data-pindex="5" title="整欄第4節設為0"><i class="bi bi-eraser"></i></button></th>
                <th><button type="button" class="btn btn-outline-secondary btn-sm py-0 px-2 clear-col-btn" data-pindex="6" title="整欄第5節設為0"><i class="bi bi-eraser"></i></button></th>
                <th><button type="button" class="btn btn-outline-secondary btn-sm py-0 px-2 clear-col-btn" data-pindex="7" title="整欄第6節設為0"><i class="bi bi-eraser"></i></button></th>
                <th><button type="button" class="btn btn-outline-secondary btn-sm py-0 px-2 clear-col-btn" data-pindex="8" title="整欄第7節設為0"><i class="bi bi-eraser"></i></button></th>
                <th><button type="button" class="btn btn-outline-secondary btn-sm py-0 px-2 clear-col-btn" data-pindex="9" title="整欄第8節設為0"><i class="bi bi-eraser"></i></button></th>
                <th><button type="button" class="btn btn-outline-secondary btn-sm py-0 px-2 clear-col-btn" data-pindex="10" title="整欄第9節設為0"><i class="bi bi-eraser"></i></button></th>
                <th><button type="button" class="btn btn-outline-secondary btn-sm py-0 px-2 clear-col-btn" data-pindex="11" title="整欄第10節設為0"><i class="bi bi-eraser"></i></button></th>
                <th></th>
              </tr>
              <!-- 第 2 列：正式欄位標題 -->
              <tr>
                <th style="width: 45px;">#</th>
                <th>班級座號</th>
                <th>日期</th>
                <th>午休</th>
                <th>早自習</th>
                <th>第1節</th>
                <th>第2節</th>
                <th>第3節</th>
                <th>第4節</th>
                <th>第5節</th>
                <th>第6節</th>
                <th>第7節</th>
                <th>第8節</th>
                <th>第9節</th>
                <th>第10節</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <!-- 由 app.js 動態產生資料列 -->
            </tbody>
          </table>
        </div>

        <!-- 表格底部的 "+" 新增列按鈕 -->
        <div class="add-row-bar">
          <button type="button" class="btn btn-outline-primary btn-sm px-4" id="addRowBtn">
            <i class="bi bi-plus-lg me-1"></i> 新增一筆資料
          </button>
        </div>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
