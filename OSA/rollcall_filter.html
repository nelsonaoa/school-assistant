<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>出缺勤 TXT 資料處理系統</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  
  <style>
    /* 讓大表格寬敞展開，同時保留你原本 CSS 的色調與圓角 */
    nav.navbar {
      max-width: 96% !important;
    }
    .wide-container {
      max-width: 96%;
      margin: 0 auto;
    }
    #uploadCard {
      max-width: 750px;
      margin: 0 auto 15px auto;
    }

    /* 拖曳上傳區 */
    .upload-drop-zone {
      border: 2px dashed #ced4da;
      border-radius: 10px;
      padding: 40px 20px;
      text-align: center;
      background-color: #ffffff;
      cursor: pointer;
      transition: all 0.2s ease-in-out;
    }
    .upload-drop-zone:hover,
    .upload-drop-zone.drag-over {
      border-color: #0d6efd;
      background-color: #f1f7ff;
    }

    /* 大表格樣式 */
    #dataTable th,
    #dataTable td {
      vertical-align: middle;
      text-align: center;
      white-space: nowrap;
      padding: 8px 6px;
    }
    #dataTable thead th {
      background-color: #f1f3f5;
      font-size: 0.9rem;
      position: sticky;
      top: 0;
      z-index: 2;
    }

    /* 班級、座號文字輸入框 */
    .code-input-2 {
      width: 44px !important;
      margin: 0 auto;
      padding: 3px 4px !important;
      text-align: center;
      font-size: 0.9rem;
    }

    /* 日期連續三格文字輸入框 */
    .date-group {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
    }
    .date-input-y {
      width: 48px !important;
      padding: 3px 4px !important;
      text-align: center;
      font-size: 0.9rem;
    }
    .date-input-md {
      width: 38px !important;
      padding: 3px 4px !important;
      text-align: center;
      font-size: 0.9rem;
    }

    /* 每一節課文字輸入框 */
    .period-input {
      width: 36px !important;
      height: 32px !important;
      margin: 0 auto;
      padding: 2px !important;
      text-align: center;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 6px;
    }
    .period-input.is-absent {
      background-color: #fff5f5;
      border-color: #dc3545;
      color: #dc3545;
    }
  </style>
</head>
<body>

  <!-- 右上角浮動通知框 -->
  <div id="msgAlert" class="alert alert-success shadow" role="alert"></div>

  <!-- 頂部導覽列 -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold text-primary" href="#">
        <i class="bi bi-file-earmark-text me-1"></i> 出缺勤 TXT 處理系統
      </a>
      <span class="navbar-text text-muted small">
        純前端即時處理
      </span>
    </div>
  </nav>

  <!-- 主內容寬版容器 -->
  <div class="wide-container">

    <!-- 區塊 1：檔案上傳卡片 -->
    <div class="card" id="uploadCard">
      <div class="card-header bg-white fw-bold">
        <i class="bi bi-cloud-arrow-up me-1"></i> 1. 匯入 TXT 檔案
      </div>
      <div class="card-body">
        <div class="upload-drop-zone" id="dropZone">
          <i class="bi bi-file-text display-4 text-secondary"></i>
          <h6 class="mt-3 mb-1">將 TXT 檔案拖曳到此處</h6>
          <p class="text-muted small mb-3">支援 UTF-8 編碼純文字檔 (.txt)</p>
          <button type="button" class="btn btn-primary btn-sm px-3" id="selectFileBtn">
            <i class="bi bi-folder2-open me-1"></i> 選擇檔案
          </button>
          <input type="file" id="fileInput" accept=".txt,text/plain" class="d-none">
        </div>
      </div>
    </div>

    <!-- 區塊 2：大表格資料編輯卡片 -->
    <div class="card d-none" id="editorCard">
      <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
        <span class="fw-bold fs-6">
          <i class="bi bi-table me-1"></i> 2. 出缺勤明細表
          <span class="badge bg-secondary ms-2" id="fileNameBadge">未命名.txt</span>
        </span>
        <div class="no-print">
          <button type="button" class="btn btn-outline-danger btn-sm" id="resetBtn">
            <i class="bi bi-arrow-counterclockwise me-1"></i> 重新上傳
          </button>
        </div>
      </div>

      <div class="card-body p-0">
        <div class="table-responsive" style="max-height: 70vh;">
          <table class="table table-bordered table-hover mb-0" id="dataTable">
            <thead>
              <tr>
                <th style="width: 45px;">#</th>
                <th>年級</th>
                <th>班級</th>
                <th>座號</th>
                <th style="min-width: 155px;">日期 (年 / 月 / 日)</th>
                <th>午休</th>
                <th>早自習</th>
                <th>第1節</th>
                <th>第2節</th>
                <th>第3節</th>
                <th>第4節</th>
                <th>第5節</th>
                <th>第6節</th>
                <th>第7節</th>
                <th>第8節</th>
                <th>第9節</th>
                <th>第10節</th>
                <th class="no-print">操作</th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <!-- 由 app.js 動態切割字串並填入各個輸入框 -->
            </tbody>
          </table>
        </div>
      </div>

      <div class="card-footer bg-white d-flex justify-content-between align-items-center py-3 no-print">
        <span class="text-muted">目前共 <strong id="rowCount" class="text-dark">0</strong> 筆資料</span>
        <div>
          <button type="button" class="btn btn-outline-dark btn-sm me-2 px-3" onclick="window.print()">
            <i class="bi bi-printer me-1"></i> 列印表格
          </button>
          <button type="button" class="btn btn-success btn-sm px-4" id="downloadBtn">
            <i class="bi bi-download me-1"></i> 下載新版 TXT
          </button>
        </div>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
