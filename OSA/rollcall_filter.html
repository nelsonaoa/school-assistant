<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TXT 資料處理工具</title>
  <!-- 引入 Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- 引入 Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- 引入你現有的 style.css (若 style.css 在上一層資料夾，請改為 ../style.css) -->
  <link rel="stylesheet" href="style.css">
  
  <style>
    /* 針對 TXT 拖曳上傳區的微調樣式 */
    .upload-drop-zone {
      border: 2px dashed #ced4da;
      border-radius: 10px;
      padding: 40px 20px;
      text-align: center;
      background-color: #ffffff;
      cursor: pointer;
      transition: all 0.2s ease-in-out;
    }
    .upload-drop-zone:hover,
    .upload-drop-zone.drag-over {
      border-color: #0d6efd;
      background-color: #f1f7ff;
    }
    .table input.form-control-sm {
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <!-- 右上角浮動通知框 -->
  <div id="msgAlert" class="alert alert-success shadow" role="alert"></div>

  <!-- 頂部導覽列 -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold text-primary" href="#">
        <i class="bi bi-file-earmark-text me-1"></i> TXT 資料處理系統
      </a>
      <span class="navbar-text text-muted small">
        純前端即時處理
      </span>
    </div>
  </nav>

  <!-- 主內容區 -->
  <div class="app-container px-2">

    <!-- 區塊 1：檔案上傳卡片 -->
    <div class="card" id="uploadCard">
      <div class="card-header bg-white fw-bold">
        <i class="bi bi-cloud-arrow-up me-1"></i> 1. 匯入 TXT 檔案
      </div>
      <div class="card-body">
        <div class="upload-drop-zone" id="dropZone">
          <i class="bi bi-file-text display-4 text-secondary"></i>
          <h6 class="mt-3 mb-1">將 TXT 檔案拖曳到此處</h6>
          <p class="text-muted small mb-3">支援 UTF-8 編碼純文字檔 (.txt)</p>
          <button type="button" class="btn btn-primary btn-sm px-3" id="selectFileBtn">
            <i class="bi bi-folder2-open me-1"></i> 選擇檔案
          </button>
          <input type="file" id="fileInput" accept=".txt,text/plain" class="d-none">
        </div>
      </div>
    </div>

    <!-- 區塊 2：資料編輯表單卡片 -->
    <div class="card d-none" id="editorCard">
      <div class="card-header bg-white d-flex justify-content-between align-items-center">
        <span class="fw-bold">
          <i class="bi bi-pencil-square me-1"></i> 2. 編輯與處理資料
          <span class="badge bg-secondary ms-1" id="fileNameBadge">未命名.txt</span>
        </span>
        <div class="no-print">
          <button type="button" class="btn btn-outline-secondary btn-sm me-1" id="addRowBtn">
            <i class="bi bi-plus-lg"></i> 新增一筆
          </button>
          <button type="button" class="btn btn-outline-danger btn-sm" id="resetBtn">
            <i class="bi bi-arrow-counterclockwise"></i> 重新上傳
          </button>
        </div>
      </div>

      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0" id="dataTable">
            <thead class="table-light">
              <tr>
                <th style="width: 60px;" class="text-center">#</th>
                <th>資料內容 (可直接修改)</th>
                <th style="width: 80px;" class="text-center no-print">操作</th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <!-- 由 app.js 動態產生資料列 -->
            </tbody>
          </table>
        </div>
      </div>

      <div class="card-footer bg-white d-flex justify-content-between align-items-center no-print">
        <span class="text-muted small">目前共 <strong id="rowCount">0</strong> 筆資料</span>
        <div>
          <button type="button" class="btn btn-outline-dark btn-sm me-1" onclick="window.print()">
            <i class="bi bi-printer me-1"></i> 列印
          </button>
          <button type="button" class="btn btn-success btn-sm px-3" id="downloadBtn">
            <i class="bi bi-download me-1"></i> 下載新版 TXT
          </button>
        </div>
      </div>
    </div>

  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- 引入獨立出來的邏輯檔 app.js -->
  <script src="app.js"></script>
</body>
</html>
